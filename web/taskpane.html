<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Definities</title>
  <link rel="stylesheet" href="taskpane.css">
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="definitions.js"></script>
  <script src="demo.js"></script>
  <script src="taskpane.js" defer></script>
</head>
<body>
  <div id="layout">
    <section id="demo-doc" hidden>
      <p class="demo-banner">Demo: klik in de tekst op een term met een hoofdletter.</p>
      <div id="demo-content"></div>
    </section>

    <main id="pane">
      <header class="toolbar">
        <input id="search" type="search" placeholder="Zoek een term…" autocomplete="off" aria-label="Zoek een term">
        <button id="refresh" class="icon-btn" title="Document opnieuw inlezen" aria-label="Document opnieuw inlezen">↻</button>
      </header>
      <p id="status" class="status">Document wordt ingelezen…</p>

      <section id="detail" hidden>
        <nav id="crumbs" aria-label="Pad"></nav>
        <div class="title-row">
          <h1 id="term-title"></h1>
          <button id="expand-all" class="link-btn"></button>
        </div>
        <div id="definitions"></div>
        <div class="actions">
          <button id="goto" class="btn">Ga naar definitie</button>
          <button id="return" class="btn secondary" hidden>Terug naar tekst</button>
        </div>
      </section>

      <section id="list-section">
        <p id="hint" class="hint">Klik in het document op een gedefinieerde term om de betekenis hier te zien.</p>
        <ul id="term-list"></ul>
      </section>
    </main>
  </div>
</body>
</html>
